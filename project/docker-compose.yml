services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${TOOLBOX_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      ANALYSIS_MODE: yolo
      YOLO_BACKEND: cpu
      YOLO_PYTHON: /app/.venv-yolo/bin/python
      YOLO_PROJECT_ROOT: /app
      YOLO_MODEL_PATH: /app/models/empty-slot-yolo11n.onnx
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
